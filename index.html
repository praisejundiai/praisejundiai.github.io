<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escala · Renascer Praise Jundiaí</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Praise JDI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra escura com navegação em pílulas; cada culto é um cartão com bloco de data, lista de pessoas e anel de confirmação. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#edf0f6; --ink:#121a2c; --muted:#5e6880; --line:#e0e5ee;
  --accent:#121a2c; --accent-ink:#ffffff; --accent-soft:#e6e8ee;
  --hero:#121a2c; --hero-ink:#ffffff; --hero-muted:#9aa5bf;
  --g:#1d8550; --g-bg:#e0f3e8; --y:#a86400; --y-bg:#fdf0d5; --r:#c23a2a; --r-bg:#fde6e2;
  --font-d:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --font-b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(18,26,44,.05),0 4px 14px rgba(18,26,44,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c111d; --surface:#141b2b; --surface-2:#1a2336; --ink:#e7ebf4; --muted:#98a2b9; --line:#242e45;
  --accent:#eef1f7; --accent-ink:#0c111d; --accent-soft:#262f45;
  --hero:#080c16; --hero-ink:#ffffff; --hero-muted:#8590aa;
  --g:#4fc98b; --g-bg:#11301f; --y:#f0b54d; --y-bg:#33260e; --r:#ff7b68; --r-bg:#3b1712;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c111d; --surface:#141b2b; --surface-2:#1a2336; --ink:#e7ebf4; --muted:#98a2b9; --line:#242e45;
  --accent:#eef1f7; --accent-ink:#0c111d; --accent-soft:#262f45;
  --hero:#080c16; --hero-ink:#ffffff; --hero-muted:#8590aa;
  --g:#4fc98b; --g-bg:#11301f; --y:#f0b54d; --y-bg:#33260e; --r:#ff7b68; --r-bg:#3b1712;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-b);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* topo */
header{background:var(--hero);color:var(--hero-ink);position:sticky;top:0;z-index:5}
.top{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-size:20px;font-weight:700}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--hero-ink);display:grid;place-items:center;color:#121a2c}
.brand small{display:block;font-family:var(--font-b);font-size:12px;font-weight:500;color:var(--hero-muted);margin-top:-2px}
nav{display:flex;gap:4px;background:rgba(255,255,255,.07);padding:4px;border-radius:12px;overflow-x:auto;max-width:100%}
nav a{padding:7px 14px;border-radius:9px;color:var(--hero-muted);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
nav a:hover{color:var(--hero-ink)}
nav a.on{background:var(--hero-ink);color:#121a2c}
.sync{margin-left:auto;font-size:12px;color:var(--hero-muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--hero-muted)}
.sync.ok i{background:#4fc98b}.sync.err i{background:#ff7b68}

main{max-width:1040px;margin:0 auto;padding:26px 20px 70px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.head h2{font-size:28px}
.head p{margin:2px 0 0;color:var(--muted);max-width:60ch}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:14px}

/* resumo */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.stat.g::before{background:var(--g)}.stat.y::before{background:var(--y)}.stat.r::before{background:var(--r)}
.stat b{font-family:var(--font-d);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:13px}

/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.ev{display:grid;grid-template-columns:auto 1fr;gap:0}
.date{width:78px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:0}
.date .m{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.date .d{font-family:var(--font-d);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.date .w{font-size:12px;color:var(--muted);text-transform:capitalize}
.date.past .m{color:var(--muted)}
.ev-body{padding:14px 18px 8px;min-width:0}
.ev-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ev-top .t{flex:1;min-width:160px}
.ev-top h3{font-size:18px}
.ev-top .meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.deadline.over{color:var(--r);font-weight:600}
.falta{color:var(--r);font-weight:700;font-size:13px}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.eqcard{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.eqh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.eqh h3{font-size:16px}
.eqrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.eqrow{display:grid;grid-template-columns:96px minmax(0,1fr) 28px;gap:6px;align-items:center}
.eqrow .fsel{font-weight:600;background:var(--surface-2);border-color:transparent}
.eqrow.voz .fsel{background:var(--accent-soft)}
.eqrow .x{padding:4px;justify-content:center}
.eqsec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.eqadd{display:flex;gap:6px;margin-top:4px}
.secao{display:flex;flex-direction:column;gap:12px}
.sec-btn{display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%;padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;color:var(--ink)}
.sec-btn:hover{border-color:var(--muted)}
.secao.on .sec-btn{background:var(--hero);color:var(--hero-ink);border-color:var(--hero)}
.secao.on .sec-btn .tag{background:rgba(255,255,255,.12);color:var(--hero-ink)}
.sec-t{font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:.02em}
.sec-n{font-size:13px;color:var(--muted)}
.secao.on .sec-n{color:var(--hero-muted)}
.sec-btn .tags{flex:1}
.sec-chev{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:600;background:var(--surface-2);color:var(--ink);margin-left:auto}
.secao.on .sec-chev{background:var(--hero-ink);color:#121a2c}
.av.grp{background:var(--hero);color:var(--hero-ink);font-size:13px}
.av.grp::after{display:none}
.todos-lista{gap:6px}
.nome-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.nome-chip i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.nome-chip.g i{background:var(--g)}.nome-chip.y i{background:var(--y)}.nome-chip.r i{background:var(--r)}
.nome-chip.r{color:var(--r)}
.todos-eq{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.todos-eq b{color:var(--ink)}
.todos-tg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.ev-tg{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:0 0 10px;cursor:pointer;text-align:left;color:inherit;flex-wrap:wrap}
.ev-tg .t{flex:1;min-width:160px}
.ev-tg h3{font-size:18px}
.ev-tg .meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.ev.mini .ev-body{padding-bottom:4px;display:flex;align-items:center}
.ev.mini .ev-tg{padding:0}
.ev.mini .date{padding:10px 0}
.ev.mini .date .d{font-size:26px}
.ev-tg:hover .sec-chev{background:var(--line)}
.lbl-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.lbl-row .btn{text-transform:none;letter-spacing:0}
.cal{padding:16px 18px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h3{font-size:20px}.cal-h h3 span{color:var(--muted);font-weight:600}
.cal-h .btn{font-size:20px;width:36px;height:36px;padding:0}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-w{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.cal-d{min-height:62px;border-radius:10px;border:1px solid transparent;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--ink);font:inherit;padding:6px 2px}
.cal-d:hover{border-color:var(--muted)}
.cal-d.fora{background:transparent;cursor:default}
.cal-d.vazio{background:transparent;color:var(--muted)}
.cal-d.passado .num{opacity:.55}
.cal-d .num{font-family:var(--font-d);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.cal-d.hoje .num{background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 7px}
.cal-d.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:7px}
.dots i,.cal-leg i{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--muted)}
.dots i.g,.cal-leg i.g{background:var(--g)}.dots i.y,.cal-leg i.y{background:var(--y)}.dots i.r,.cal-leg i.r{background:var(--r)}
.dots i.pg{background:var(--g);opacity:.4}.dots i.pr{background:var(--r);opacity:.4}
.cal-leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.cal-leg span{display:inline-flex;align-items:center;gap:6px}
.dica-cal{margin-left:auto}
@media (max-width:640px){.cal{padding:12px 10px}.cal-d{min-height:52px;gap:4px}.cal-d .num{font-size:15px}.dots i{width:6px;height:6px}.dica-cal{margin-left:0}}
.subs{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:260px;overflow:auto}
.sub-op{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.sub-op:has(input:checked){border-color:var(--ink);background:var(--surface-2)}
.sub-op .av{width:30px;height:30px;font-size:12px}.sub-op .av::after{display:none}
.sub-n{flex:1;font-weight:600}
.pedido{border-color:var(--y);box-shadow:0 0 0 1px var(--y)}
.enviado{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.enviado p{margin:0}
.enviado .btn.big{width:100%;flex:none}
.ok-ico{width:48px;height:48px;border-radius:50%;background:var(--y-bg);color:var(--y);display:grid;place-items:center;font-size:22px;font-weight:700}
body.min{background:#000}
body.min header, body.min footer{display:none}
body.min main{max-width:none;padding:0;display:block}
.screen.full{min-height:100vh;min-height:100dvh;border-radius:0;max-width:560px;margin:0 auto;background:var(--bg)}
body.min .splash{min-height:100vh;min-height:100dvh}
.screen.full .s-head{padding-top:max(22px, env(safe-area-inset-top))}
.lider-login{max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:10px}
.lider-login input{width:100%}
.topbtn{color:var(--hero-muted)}
.topbtn:hover{background:rgba(255,255,255,.08);color:var(--hero-ink)}
.link-row{gap:6px}
/* ===== diagramação v2 ===== */
.duo{display:flex;flex-direction:column;gap:14px}
.duo-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.duo-main > .label:first-child{margin-top:0}
@media (min-width:1000px){
  main{max-width:1240px}
  .top{max-width:1240px}
  .duo{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start}
  .duo-cal{position:sticky;top:84px}
  .duo-cal .cal-d{min-height:50px}
  .duo-cal .cal-d .num{font-size:15px}
  .duo-cal .cal-leg{flex-direction:column;gap:6px}
  .duo-cal .dica-cal{margin-left:0}
}
.chip-s{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.chip-s.r{background:var(--r-bg);color:var(--r)}.chip-s.y{background:var(--y-bg);color:var(--y)}
.resumo{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dt-inline{display:none;font-weight:600;color:var(--ink)}
.ev.mini .ev-tg{padding:2px 0}
.row .acts{gap:6px}
.vcard{padding:14px}
.vcard .when{font-size:18px}
.vcard .btn.big{padding:11px 14px;font-size:15px}
.eqrow{grid-template-columns:112px minmax(0,1fr) 28px}
@media (max-width:640px){
  header{position:static}
  .top{padding:10px 14px;gap:10px}
  .brand{font-size:17px}.brand .mark{width:26px;height:26px}
  .sync{display:none}
  .topbtn{padding:4px 8px;font-size:12px}
  nav{order:3;width:100%;justify-content:stretch}
  nav a{flex:1;text-align:center;padding:8px 6px;font-size:13px}
  main{padding:16px 12px 60px}
  .head h2{font-size:23px}
  .head p{font-size:14px}
  .ev .date{display:none}
  .ev{grid-template-columns:1fr}
  .dt-inline{display:inline}
  .ev-body{padding:12px 14px 6px}
  .ev-tg h3{font-size:16px}
  .ring svg{width:34px;height:34px}
  .row{grid-template-columns:32px minmax(0,1fr) auto;gap:4px 10px;padding:9px 0}
  .row .av{width:32px;height:32px;font-size:12px}
  .row .right{grid-column:auto;justify-content:flex-end}
  .row .acts{grid-column:1 / -1;padding-left:42px}
  .pill{font-size:11px;padding:3px 8px}
  .stat{padding:10px 12px}.stat b{font-size:24px}.stat small{font-size:12px}
  .lbl-row .btn{padding:4px 6px}
  .eqrow{grid-template-columns:104px minmax(0,1fr) 26px}
  .cal{padding:10px 8px}
  .brand{flex:1}
  .topbtn[href]{display:none}
  .ev-tg{flex-wrap:nowrap;gap:10px}
  .ev-tg .t{min-width:0;flex:1}
  .ev-tg .ring{gap:6px;font-size:11px;line-height:1.2}
  .ev-tg .ring b{font-size:14px}
  .ev-tg .sec-chev{width:28px;height:28px;font-size:17px;flex:none}
  .ev-top{gap:8px}
  .sec-btn{flex-wrap:nowrap;padding:14px 16px}
  .sec-btn .sec-n{display:none}
  .sec-btn .tags{overflow:hidden}
}
.av.vazio{background:var(--surface-2);color:var(--muted);border:1.5px dashed var(--muted)}
.ring{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.ring svg{display:block}
.ring b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}

.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rows .row:first-child{border-top:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;position:relative}
.av::after{content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:var(--muted)}
.av.g::after{background:var(--g)}.av.y::after{background:var(--y)}.av.r::after{background:var(--r)}
.who{min-width:0}
.who .n{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who .sub{font-size:13px;color:var(--muted)}
.who .motivo{font-size:13px;color:var(--r)}
.right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.g{background:var(--g-bg);color:var(--g)}.pill.y{background:var(--y-bg);color:var(--y)}.pill.r{background:var(--r-bg);color:var(--r)}
.acts{grid-column:2 / -1;display:flex;gap:6px;flex-wrap:wrap}
.acts:empty{display:none}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--g);border-color:var(--g);color:#fff}
.btn.no{border-color:var(--r);color:var(--r);background:transparent}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.big{padding:13px 16px;font-size:16px;flex:1;border-radius:12px;text-align:center}
input,select,textarea{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
textarea{width:100%;min-height:84px;resize:vertical}
select.sm{padding:5px 8px;font-size:13px;border-radius:8px}

.panel{padding:18px}
.panel h3{font-size:16px;margin-bottom:12px}
.formrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.formrow .grow{flex:1;min-width:170px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer}
.chk:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chk input{margin:0}
.addvaga{padding:10px 0 12px;border-top:1px dashed var(--line);margin-top:2px}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.person{padding:16px;display:flex;flex-direction:column;gap:12px}
.person .ph{display:flex;align-items:center;gap:12px}
.person .ph .av{width:44px;height:44px;font-size:15px}
.person .ph .av::after{display:none}
.person h3{font-size:16px}
.person .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .top{padding:0;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter .top b{font-family:var(--font-d);font-size:18px;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.track span{display:block;height:100%;border-radius:6px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.nums div{background:var(--surface-2);border-radius:10px;padding:6px 4px;font-size:11px;color:var(--muted);line-height:1.25}
.nums b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.nums b.bad{color:var(--r)}
.indisp{font-size:13px;color:var(--muted)}

/* visão do voluntário: tela de celular */
.vol-wrap{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:28px;align-items:start}
.vol-side{display:flex;flex-direction:column;gap:12px}
.vol-side p{margin:0;color:var(--muted);max-width:52ch}
.phone{background:var(--hero);border-radius:38px;padding:10px;box-shadow:0 20px 50px rgba(18,26,44,.18)}
.screen{background:var(--bg);border-radius:30px;overflow:hidden;min-height:640px}
.s-head{background:#121a2c;color:#fff;padding:22px 20px 20px}
.s-head small{opacity:.8;font-size:13px}
.s-head h3{font-size:22px;margin-top:2px}
.s-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.s-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.vcard{padding:16px;display:flex;flex-direction:column;gap:6px}
.vcard .vtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vcard .when{font-family:var(--font-d);font-size:20px;font-weight:700}
.vcard .sub{font-size:13px;color:var(--muted)}
.vbtns{display:flex;gap:8px;margin-top:8px}
.empty{color:var(--muted);font-size:14px;padding:4px 2px}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;cursor:pointer;width:100%;font:inherit;color:var(--ink)}
.pick:hover{border-color:var(--muted)}
.pick .av::after{display:none}
.sair{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer}
#login-nome{width:100%;font-size:16px;padding:12px 14px}
.splash{background:#000;color:#fff;min-height:640px;display:flex;flex-direction:column;justify-content:space-between;padding:34px 26px 28px;font-family:"Space Grotesk","Figtree",system-ui,sans-serif}
.sp-top{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8a8a8a;text-align:center;font-weight:500}
.wordmark{display:flex;flex-direction:column;align-items:center;line-height:.86}
.wordmark .w1,.wordmark .w2{font-weight:700;font-size:58px;letter-spacing:-.03em}
.wordmark .lt{display:inline-block;opacity:0;animation:foco 1100ms cubic-bezier(0.16,1,0.3,1) both;animation-delay:calc(200ms + var(--i) * 70ms)}
.wordmark{cursor:pointer}
@keyframes foco{from{filter:blur(14px);transform:scale(1.5);opacity:0}to{filter:blur(0);transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){@keyframes foco{from{opacity:0}to{opacity:1}}}
.wordmark .w2{font-size:76px}
.wordmark .w3{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:500;font-size:15px;letter-spacing:.5em;padding-left:.5em;color:#d9d9d9}
.wordmark .w3 i{display:block;width:26px;height:1px;background:#5a5a5a}
.sp-logo{width:132px;height:auto;margin-bottom:30px;display:block}
.sp-top{position:relative;padding:0 34px}
.sp-replay{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:1px solid #333;background:transparent;color:#8a8a8a;font-size:14px;cursor:pointer;display:grid;place-items:center;padding:0}
.sp-replay:hover{color:#fff;border-color:#666}
.sp-bottom{display:flex;flex-direction:column;gap:14px}
.sp-next{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #262626;padding-top:14px;font-size:13px;color:#8a8a8a}
.sp-next b{color:#fff;font-size:15px;font-weight:800;text-transform:capitalize}
.sp-btn{background:#fff;color:#000;border:0;border-radius:999px;padding:16px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;letter-spacing:-.01em}
.sp-btn:hover{background:#e6e6e6}
.phone:has(.splash){background:#1a1a1a}
:root[data-theme="dark"] .phone{background:#2b3245;box-shadow:0 0 0 1px #3a4360,0 20px 50px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .phone{background:#2b3245;box-shadow:0 0 0 1px #3a4360,0 20px 50px rgba(0,0,0,.5)}}
.dica{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:16px}
.dica p{margin:0;font-size:14px;color:var(--muted)}
.chipx{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:0;cursor:pointer;color:var(--ink)}
.chipx:hover{background:var(--r-bg);color:var(--r)}

#modal{position:fixed;inset:0;background:rgba(8,12,22,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--surface);border-radius:18px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal h3{font-size:19px;margin-bottom:6px}
#modal p{margin:0 0 12px;color:var(--muted)}
#modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
pre.msg{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:14px;font:inherit;font-size:14px;margin:8px 0 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{max-width:1040px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:860px){.vol-wrap{grid-template-columns:1fr}.vol-side > p:first-of-type{display:none}.phone{max-width:390px;width:100%;margin:0 auto}}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.date{width:62px}.ev-body{padding:12px 14px 6px}.right{grid-column:2 / -1;justify-content:flex-start}.sync{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header>
  <div class="top">
    <div class="brand"><div class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div>Escala<small>Renascer Praise Jundiaí</small></div></div>
    <nav id="nav">
      <a href="#painel" data-r="painel">Painel</a>
      <a href="#escala" data-r="escala">Montar escala</a>
      <a href="#voluntarios" data-r="voluntarios">Equipe</a>
    </nav>
    <div class="sync" id="sync"><i></i><span>Conectando…</span></div>
    <a class="btn sm ghost topbtn" href="./" title="Abrir a tela dos ministros">Tela dos ministros</a>
    <button class="btn sm ghost topbtn" data-act="sair-lider" id="btn-sair">Sair</button>
  </div>
</header>
<main id="view"></main>
<footer>Renascer Praise Jundiaí · prazo de confirmação de 48h antes do culto</footer>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast" role="status"></div>

<script>
const INSTRUMENTOS = ["KEYS","VIOLÃO","GUITAR","BASS","DRUM"];
const VOZES = ["MINISTRO","BACKING"];
const FUNCOES = [...VOZES, ...INSTRUMENTOS];            /* o que cada pessoa sabe fazer */
const PAPEIS = [...VOZES, ...INSTRUMENTOS];          /* posições na escala */
const habilidade = f => f;
const podeFazer = (p, f) => p.funcoes.includes(habilidade(f));
function faltando(ev){ const c = {}; ev.vagas.filter(v => v.status === "aberta").forEach(v => c[v.funcao] = (c[v.funcao]||0)+1);
  return Object.entries(c).map(([f, n]) => n > 1 ? `${n} ${f}` : f); }
const EQUIPE_PADRAO = () => [{funcao:"MINISTRO",pid:""},{funcao:"BACKING",pid:""},{funcao:"BACKING",pid:""},{funcao:"KEYS",pid:""},{funcao:"GUITAR",pid:""},{funcao:"BASS",pid:""},{funcao:"DRUM",pid:""}];
const PRAZO_H = 48;
const DIAS = ["dom","seg","ter","qua","qui","sex","sáb"];
const MESES = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const AV_CORES = ["#2f5bd3","#0e7490","#b45309","#be185d","#6d28d9","#047857","#9f1239","#1e40af"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = () => ymd(new Date());
const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const shiftDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate()+n); return ymd(d); };
function dtEvento(ev){ const d = parseDate(ev.data); const [h,mi] = (ev.hora||"00:00").split(":").map(Number); d.setHours(h, mi, 0, 0); return d; }
const prazo = ev => new Date(dtEvento(ev).getTime() - PRAZO_H*3600e3);
const fmtData = s => { const d = parseDate(s); return `${DIAS[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fmtDT = d => `${DIAS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)} às ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const byDate = (a, b) => dtEvento(a) - dtEvento(b);
const primeiro = nome => { const w = String(nome).split(" "); return w[0].endsWith(".") && w[1] ? w[0]+" "+w[1] : w[0]; };
const iniciais = nome => String(nome).split(" ").filter(Boolean).slice(0, 2).map(x => x[0]).join("").toUpperCase();
const corDe = id => { let h = 0; for (const c of String(id)) h = (h*31 + c.charCodeAt(0)) >>> 0; return AV_CORES[h % AV_CORES.length]; };
const avatar = (p, c="") => p.vazio ? `<div class="av ${c} vazio" aria-hidden="true">?</div>` : `<div class="av ${c}" style="background:${corDe(p.id)}" aria-hidden="true">${esc(iniciais(p.nome))}</div>`;

/* ---------- dados de exemplo ---------- */
const AGENDA = [{dow:0,hora:"08:00"},{dow:0,hora:"10:00"},{dow:0,hora:"16:00"},{dow:0,hora:"18:00"},{dow:1,hora:"20:00"},{dow:2,hora:"20:00"},{dow:4,hora:"20:00"}];
const NOME_DIA = ["Culto de domingo","Culto de segunda","Culto de terça","Culto de quarta","Culto de quinta","Culto de sexta","Culto de sábado"];
function proxDow(dow, incluirHoje){ const d = new Date(); let diff = (dow - d.getDay() + 7) % 7; if (!diff && !incluirHoje) diff = 7; d.setDate(d.getDate()+diff); return ymd(d); }
function cultosEntre(ini, dias){
  const out = [];
  for (let i = 0; i < dias; i++) { const data = shiftDays(ini, i), dow = parseDate(data).getDay();
    AGENDA.filter(a => a.dow === dow).forEach(a => out.push({data, hora: a.hora, nome: NOME_DIA[dow]})); }
  return out;
}
/* ===================== CONEXÃO ===================== */
const SUPABASE_URL = "https://xbksicqfblafgfidrrix.supabase.co";
const SUPABASE_KEY = "sb_publishable_tgGVMyv1J5rqZGYHdpdNUw_CJHCoyVQ";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth: {persistSession: true, detectSessionInUrl: true}});
const LS = {get: k => { try { return localStorage.getItem(k); } catch(e) { return null; } },
            set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e) {} }};

let state = {pessoas: [], eventos: [], equipes: {}, todasVozes: {}};
const ROTAS_LIDER = ["painel", "escala", "voluntarios", "lider"];
const modoLider = () => ROTAS_LIDER.includes(location.hash.replace("#", ""));
let sessao = null, ehLider = null, carregado = false;

/* token pessoal do ministro: vem no link (?t=...) e fica guardado no celular */
(() => { const t = new URLSearchParams(location.search).get("t"); if (t) LS.set("escala_token", t); })();
let token = LS.get("escala_token");
let euId = null, proxCulto = null;

const pessoa = id => state.pessoas.find(p => p.id === id) || {id: id || "x", nome: id ? "(removido)" : "Vaga aberta", whats:"", funcoes:[], indisp:[], vazio: !id};
const evento = id => state.eventos.find(e => e.id === id);
const vaga = (ev, id) => ev.vagas.find(v => v.id === id);

function situacao(ev, v){
  if (v.status === "aberta") return {t:"Sem ninguém", c:"r"};
  if (v.status === "presente") return {t:"Presente", c:"g"};
  if (v.status === "faltou") return {t:"Faltou sem avisar", c:"r"};
  if (v.status === "confirmado") return {t:"Confirmado", c:"g"};
  if (v.status === "recusado") return {t: ehTodos(v) ? "Não vai" : "Troca aberta pelo líder", c:"r"};
  if (v.status === "trocando") return v.pedidoPara ? {t:`Aguardando ${primeiro(pessoa(v.pedidoPara).nome)} aceitar`, c:"y"} : {t:"Procurando substituto", c:"r"};
  if (new Date() > prazo(ev)) return {t:"Sem resposta", c:"r"};
  return {t:"Aguardando", c:"y"};
}
const PREP = {GUITAR:"na", MINISTRO:"como"};
const naFuncao = f => `${PREP[f] || "no"} *${f}*`;
const fmtHora = h => { const [hh, mm] = h.split(":"); return `${+hh}h${mm !== "00" ? mm : ""}`; };
const quando = ev => { const d = parseDate(ev.data); return `${ev.nome.charAt(0).toLowerCase() + ev.nome.slice(1)}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}, às ${fmtHora(ev.hora)}`; };
function msgConvite(ev, v){
  const p = pessoa(v.pessoaId), pz = prazo(ev);
  return `Olá, ${primeiro(p.nome)}! Você está na escala ${naFuncao(v.funcao)}${ehTodos(v) ? " (todas as vozes)" : ""} do ${quando(ev)}.\n\nConfirme no app da escala até ${DIA_LONGO[pz.getDay()].toLowerCase()}, ${pad(pz.getDate())}/${pad(pz.getMonth()+1)}, às ${fmtHora(`${pad(pz.getHours())}:${pad(pz.getMinutes())}`)}.\nSe não puder, toque em "Não posso" e escolha quem vai te substituir.\n\nObrigado por servir!`;
}
/* No Android, abre direto o WhatsApp comum (com.whatsapp), mesmo com o Business instalado.
   Se o WhatsApp comum não estiver instalado, cai no link normal do wa.me. */
const ANDROID = /Android/i.test(navigator.userAgent);
const waLink = (p, msg) => {
  const num = (p.whats || "").replace(/\D/g, ""), txt = encodeURIComponent(msg);
  const web = `https://wa.me/${num}?text=${txt}`;
  return ANDROID ? `intent://send?phone=${num}&text=${txt}#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url=${encodeURIComponent(web)};end` : web;
};
function escaladoNoHorario(pid, ev){
  return state.eventos.some(e => e.data === ev.data && e.hora === ev.hora && e.vagas.some(v => v.pessoaId === pid && v.status !== "recusado"));
}
function stats(pid){
  let total=0, pres=0, falt=0, rec=0;
  state.eventos.forEach(e => e.vagas.forEach(v => {
    if (v.pessoaId !== pid) return; total++;
    if (v.status==="presente") pres++; else if (v.status==="faltou") falt++; else if (v.status==="recusado") rec++;
  }));
  return {total, pres, falt, rec, idx: pres+falt ? Math.round(100*pres/(pres+falt)) : null};
}
function fmtTel(w){ const d = String(w).replace(/\D/g,"").replace(/^55/,""); return d.length===11 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : d; }

/* ---------- peças visuais ---------- */
function dateTile(ev, passado){
  const d = parseDate(ev.data);
  return `<div class="date ${passado?"past":""}"><span class="m">${MESES[d.getMonth()]}</span><span class="d">${pad(d.getDate())}</span><span class="w">${DIAS[d.getDay()]}</span></div>`;
}
function ring(ok, total){
  const r = 15, C = 2*Math.PI*r, f = total ? ok/total : 0;
  const cor = f === 1 ? "var(--g)" : f >= .6 ? "var(--accent)" : "var(--y)";
  return `<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="5"/>
    <circle cx="20" cy="20" r="${r}" fill="none" stroke="${cor}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 20 20)"/></svg>`;
}

/* ---------- telas ---------- */
function rowLider(ev, v, passado){
  const p = pessoa(v.pessoaId), s = situacao(ev, v);
  let acts = "";
  if (passado || ev.data === hoje()) {
    if (v.status==="confirmado" || v.status==="pendente")
      acts += `<button class="btn sm ok" data-act="checkin" data-e="${ev.id}" data-v="${v.id}" data-s="presente">Veio</button>
               <button class="btn sm no" data-act="checkin" data-e="${ev.id}" data-v="${v.id}" data-s="faltou">Faltou</button>`;
    else if (v.status==="presente" || v.status==="faltou")
      acts += `<button class="btn sm ghost" data-act="checkin" data-e="${ev.id}" data-v="${v.id}" data-s="confirmado">Desfazer check-in</button>`;
  }
  if (!passado) {
    if (v.status==="pendente")
      acts += `<a class="btn sm wa" href="${waLink(p, msgConvite(ev, v))}" target="_blank" rel="noopener">${s.c==="r"?"Cobrar":"Lembrar"} no WhatsApp</a>
               <button class="btn sm ghost" data-act="msg" data-e="${ev.id}" data-v="${v.id}">Ver mensagem</button>`;
    if (v.status==="recusado" || v.status==="aberta" || v.status==="trocando") {
      const opts = state.pessoas.filter(o => o.id!==v.pessoaId && podeFazer(o, v.funcao) && !o.indisp.includes(ev.data) && !escaladoNoHorario(o.id, ev))
        .map(o => `<option value="${o.id}">${esc(o.nome)}</option>`).join("");
      acts += opts ? `<select class="sm" data-act="subst" data-e="${ev.id}" data-v="${v.id}" aria-label="Escolher ${esc(v.funcao)}"><option value="">${v.status==="aberta" ? "Escolher quem vai…" : "Escolher substituto…"}</option>${opts}</select>`
                   : `<span class="pill y">Ninguém livre em ${esc(v.funcao)}</span>`;
    }
  }
  return `<div class="row">${avatar(p, s.c)}
    <div class="who"><div class="n">${esc(p.nome)} <span class="tag">${esc(v.funcao)}</span></div>
      ${v.motivo ? `<div class="motivo">Motivo: ${esc(v.motivo)}</div>` : ""}</div>
    <div class="right"><span class="pill ${s.c}">${s.t}</span></div>
    <div class="acts">${acts}</div></div>`;
}
function cardEvento(ev, passado){
  const normais = ev.vagas.filter(v => !ehTodos(v)), n = normais.length, c = {g:0,y:0,r:0};
  normais.forEach(v => c[situacao(ev, v).c]++);
  const pz = prazo(ev), encerrado = new Date() > pz, ord = {r:0,y:1,g:2};
  const vagas = passado ? normais : [...normais].sort((a,b) => ord[situacao(ev,a).c] - ord[situacao(ev,b).c]);
  const on = painelAbertos[ev.id] ?? false;
  const resumo = passado ? "" : [c.r ? `<span class="chip-s r">${c.r} sem resposta/troca</span>` : "", c.y ? `<span class="chip-s y">${c.y} aguardando</span>` : ""].join("");
  const topo = `<button class="ev-tg" data-act="tg-painel" data-e="${ev.id}" aria-expanded="${on}">
      <div class="t"><h3>${esc(ev.nome)}</h3>
        <div class="meta"><span class="dt-inline">${fmtData(ev.data)} ·</span><span>${esc(ev.hora)}</span>${!passado && faltando(ev).length ? `<span class="falta">Falta ${faltando(ev).join(", ")}</span>` : ""}${passado ? `<span>Check-in</span>` : `<span class="deadline ${encerrado?"over":""}">${encerrado ? "Prazo encerrado" : "Confirmar até "+fmtDT(pz)}</span>`}</div>
        ${resumo ? `<div class="resumo">${resumo}</div>` : ""}</div>
      <div class="ring">${ring(c.g, n)}<div><b>${c.g}/${n}</b><br>${passado ? "presentes" : "confirmados"}</div></div>
      <span class="sec-chev" aria-hidden="true">${on ? "−" : "+"}</span></button>`;
  if (!on) return `<article class="card ev mini">${dateTile(ev, passado)}<div class="ev-body">${topo}</div></article>`;
  return `<article class="card ev">${dateTile(ev, passado)}
    <div class="ev-body">${topo}
      <div class="rows">${blocoTodos(ev)}${vagas.map(v => rowLider(ev, v, passado)).join("") || `<div class="empty" style="padding:12px 0">Ninguém escalado ainda. Use a aba Montar escala.</div>`}</div>

function telaLogin(){
  let res = "";
  if (busca.sel) {
    const p = busca.sel;
    return `<div class="s-head"><small>Escala dos ministros</small><h3>Olá, ${esc(primeiro(p.nome))}!</h3><small>Só para confirmar que é você.</small></div>
      <div class="s-body">
        <form class="card vcard" data-form="codigo">
          <label for="login-cod" class="s-label" style="margin:0">4 últimos números do seu WhatsApp</label>
          <input id="login-cod" name="cod" type="tel" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="0000" autocomplete="off" required style="font-size:28px;letter-spacing:.4em;text-align:center">
          ${busca.erro ? `<div class="sub" style="color:var(--r)">${esc(busca.erro)}</div>` : ""}
          <button class="btn big pri" style="margin-top:6px">Entrar</button>
        </form>
        <button class="btn ghost" data-act="voltar-busca">Não sou ${esc(primeiro(p.nome))}</button>
      </div>`;
  }
  if (busca.res) {
    if (!busca.res.length) res = `<div class="empty">Não encontramos “${esc(busca.q)}”. Confira a grafia ou fale com o líder do louvor.</div>`;
    else res = `<div class="s-label">É você?</div>` + busca.res.map(p => `<button class="card pick" data-act="escolher" data-p="${esc(p.id)}">${avatar(p)}<span><b>${esc(p.nome)}</b><br><span class="sub">${(p.funcoes || []).join(" · ")}</span></span></button>`).join("");
  }
  return `<div class="s-head"><small>Escala dos ministros</small><h3>Ver minha escala</h3><small>Digite seu nome para ver quando você serve.</small></div>
    <div class="s-body">
      <form class="card vcard" data-form="login">
        <label for="login-nome" class="s-label" style="margin:0">Seu nome</label>
        <input id="login-nome" name="nome" type="text" placeholder="Ex.: Nathy" value="${esc(busca.q)}" autocomplete="off" required>
        <button class="btn big pri" style="margin-top:6px">Buscar</button>
      </form>${res}
    </div>`;
}
function elegiveis(ev, v){
  return state.pessoas.filter(p => p.id !== v.pessoaId && podeFazer(p, v.funcao) && !p.indisp.includes(ev.data) && !escaladoNoHorario(p.id, ev) && !(v.recusaram || []).includes(p.id));
}
function msgPedido(ev, v, p){
  return `Oi, ${primeiro(p.nome)}! Não vou conseguir servir ${naFuncao(v.funcao)} do ${quando(ev)}. Você consegue me cobrir? Se puder, aceite o pedido no app da escala. Obrigado!`;
}
function modalTroca(ev, v){
  const ops = elegiveis(ev, v);
  modal(`<h3>Quem pode te substituir?</h3>
    <p>Escolha quem você quer pedir. Depois do pedido, abre o WhatsApp para vocês conversarem. <b>Você continua na escala até a pessoa aceitar.</b></p>
    <textarea id="motivo" placeholder="Motivo (ex.: viagem, plantão no trabalho…)" aria-label="Motivo">${esc(v.motivo || "")}</textarea>
    <div class="subs">${ops.map(p => `<label class="sub-op"><input type="radio" name="sub" value="${p.id}">${avatar(p)}<span class="sub-n">${esc(p.nome)}</span></label>`).join("")
      || `<div class="empty">Ninguém da sua função está livre nesse horário.</div>`}</div>
    <div class="foot" style="justify-content:space-between;flex-wrap:wrap">
      <button class="btn ghost sm" data-act="avisar-lider" data-e="${ev.id}" data-v="${v.id}">Não achei ninguém, avisar o líder</button>
      <span style="display:flex;gap:8px"><button class="btn" data-act="close">Voltar</button>${ops.length ? `<button class="btn pri" data-act="pedir-troca" data-e="${ev.id}" data-v="${v.id}">Enviar pedido</button>` : ""}</span></div>`);
}
function viewVoluntario(){
  const t = hoje();
  const logado = euId && state.pessoas.some(p => p.id === euId);
  let tela;
  if (splash) tela = telaSplash();
  else if (!logado && token) tela = `<div class="s-body"><div class="empty" style="padding:40px 0;text-align:center">Carregando sua escala…</div></div>`;
  else if (!logado) tela = telaLogin();
  else {
    const eu = pessoa(euId);
    const futuros = state.eventos.filter(e => e.data >= t).sort(byDate);
    const minhas = [], trocas = [], pedidos = [];
    futuros.forEach(e => e.vagas.forEach(v => {
      if (v.status === "trocando" && v.pedidoPara === euId) pedidos.push([e, v]);
      if (v.pessoaId === euId) minhas.push([e, v]);
      else if (!ehTodos(v) && (v.status==="recusado" || v.status==="aberta") && podeFazer(eu, v.funcao) && !eu.indisp.includes(e.data) && !escaladoNoHorario(euId, e)) trocas.push([e, v]);
    }));
    const pend = minhas.filter(([e, v]) => v.status === "pendente").length + pedidos.length;
    const card = ([e, v]) => { const s = situacao(e, v);
      let btns = "";
      if (v.status==="pendente") btns = `<div class="vbtns"><button class="btn big ok" data-act="confirmar" data-e="${e.id}" data-v="${v.id}">Confirmo</button><button class="btn big no" data-act="recusar" data-e="${e.id}" data-v="${v.id}">Não posso</button></div>`;
      else if (v.status==="trocando" && v.pedidoPara) btns = `<div class="sub">Pedido enviado para <b>${esc(pessoa(v.pedidoPara).nome)}</b>. Você continua na escala até ele(a) aceitar.</div>
        <div class="vbtns"><a class="btn big wa" href="${waLink(pessoa(v.pedidoPara), msgPedido(e, v, pessoa(v.pedidoPara)))}" target="_blank" rel="noopener">Conversar com ${esc(primeiro(pessoa(v.pedidoPara).nome))} no WhatsApp</a></div>
        <div class="vbtns" style="margin-top:0"><button class="btn sm" data-act="recusar" data-e="${e.id}" data-v="${v.id}">Pedir para outra pessoa</button><button class="btn sm ghost" data-act="cancelar-troca" data-e="${e.id}" data-v="${v.id}">Vou servir</button></div>`;
      else if (v.status==="trocando") btns = `<div class="sub" style="color:var(--r)">${esc((v.recusaram||[]).map(id => primeiro(pessoa(id).nome)).join(", "))} não pode. Escolha outra pessoa.</div>
        <div class="vbtns"><button class="btn big pri" data-act="recusar" data-e="${e.id}" data-v="${v.id}">Escolher substituto</button></div>`;
      else if (v.status==="confirmado") btns = `<div><button class="btn sm ghost" style="padding-left:0" data-act="recusar" data-e="${e.id}" data-v="${v.id}">Surgiu um imprevisto? Pedir troca</button></div>`;
      else if (v.status==="recusado" && ehTodos(v)) btns = `<div class="sub">O líder foi avisado. Não precisa de substituto.</div>`;
      else if (v.status==="recusado") btns = `<div class="sub">A equipe de ${esc(v.funcao)} foi avisada. Quando alguém assumir, a vaga sai da sua lista.</div>`;
      return `<article class="card vcard"><div class="vtop"><span class="tag">${esc(v.funcao)}${ehTodos(v) ? " · TODAS AS VOZES" : ""}</span><span class="pill ${s.c}">${s.t}</span></div>
        <div class="when">${fmtData(e.data)} · ${esc(e.hora)}</div>
        <div class="sub">${esc(e.nome)}${v.status==="pendente" ? ` · responda até ${fmtDT(prazo(e))}` : ""}</div>${btns}</article>`; };

          <div class="when">${fmtData(e.data)} · ${esc(e.hora)}</div><div class="sub">${esc(e.nome)}</div>
          <div class="vbtns"><button class="btn big pri" data-act="assumir" data-e="${e.id}" data-v="${v.id}">Assumir esta vaga</button></div></article>`).join("") || `<div class="empty">Nenhuma vaga aberta nas suas funções.</div>`}
        <div class="s-label">Datas em que não posso servir</div>
        <article class="card vcard">
          <form class="formrow" data-form="indisp"><input class="grow" type="date" name="data" id="indisp-data" min="${t}" required aria-label="Data indisponível"><button class="btn">Marcar</button></form>

        </article>

  }
  return `<div class="screen full">${tela}</div>`;
}

function modal(html){ $("#mbox").innerHTML = html; $("#modal").classList.add("on"); }

    case "rm-pessoa": { const p = pessoa(b.dataset.p); modal(`<h3>Remover ${esc(p.nome)} da equipe?</h3><p>Ela sai das equipes fixas e das escalas futuras fica como vaga aberta.</p>

      state.pessoas = state.pessoas.filter(p => p.id !== id);
      for (const k in state.equipes) state.equipes[k].forEach(r => { if (r.pid === id) r.pid = ""; });

      closeModal(); commit("Removido da equipe"); break; }

document.addEventListener("change", e => {

  if (cb) { state.todasVozes = state.todasVozes || {}; state.todasVozes[cb.dataset.slot] = cb.checked; commit(cb.checked ? "Todas as vozes entram nesse culto" : "Backing volta a ser por escala"); return; }
  const s = e.target.closest("select[data-act]"); if (!s) return;
  if (s.dataset.act === "eq-func" || s.dataset.act === "eq-pess") {
    const r = state.equipes[s.dataset.slot][+s.dataset.i];

    else r.pid = s.value;
    commit(); return;
  }
  if (s.dataset.act === "subst" && s.value) {

    v.pessoaId = s.value; v.status = "pendente"; v.motivo = ""; v.troca = false;

  }
});
document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-form]"); if (!f) return; e.preventDefault();
  const fd = new FormData(f);
  switch (f.dataset.form) {
    case "evento": state.eventos.push({id: uid(), nome: fd.get("nome").trim(), data: fd.get("data"), hora: fd.get("hora"), vagas: []}); commit("Culto criado. Agora escale as pessoas."); break;
    case "vaga": { const [funcao, pid] = String(fd.get("pf")).split("|"); if (!pid) return;
      evento(f.dataset.e).vagas.push({id: uid(), funcao, pessoaId: pid, status: "pendente", motivo: "", troca: false}); commit(`${primeiro(pessoa(pid).nome)} escalado(a) em ${funcao}`); break; }
    case "pessoa": { const funcoes = fd.getAll("f"); if (!funcoes.length) { toast("Marque pelo menos uma função"); return; }
      let w = String(fd.get("whats") || "").replace(/\D/g, ""); if (w && w.length <= 11) w = "55" + w;
      state.pessoas.push({id: uid(), nome: fd.get("nome").trim(), whats: w, funcoes, indisp: []}); commit("Voluntário adicionado"); break; }
    case "login": { const q = String(fd.get("nome")).trim(); busca = {q, res: null};
      if (norm(q).length < 2) { toast("Digite pelo menos 2 letras do seu nome"); return; }
      const {data, error} = await sb.rpc("ministro_buscar", {q});
      if (error) { toast("Sem conexão. Tente de novo."); return; }
      if (data.length === 1) return escolherPessoa(data[0]);
      busca.res = data; render(); return; }
    case "codigo": {
      const {data, error} = await sb.rpc("ministro_entrar", {p_id: busca.sel.id, p_final: String(fd.get("cod"))});
      if (error) { busca.erro = error.message; render(); return; }
      if (!data) { busca.erro = "Os números não conferem. Confira e tente de novo."; render(); return; }
      return logarMinistro(data); }
    case "indisp": return acaoMinistro("indisp-add", {dataset: {d: fd.get("data")}});
    case "login-lider": {
      loginErro = ""; loginEmail = String(fd.get("email"));
      const {error} = await sb.auth.signInWithPassword({email: fd.get("email"), password: fd.get("senha")});
      if (error) { loginErro = "E-mail ou senha incorretos."; render(); }
      return; }
  }
});

/* ===================== MINISTROS (sem login, com código pessoal) ===================== */
function logarMinistro(tk){
  token = tk; LS.set("escala_token", tk); busca = {q: "", res: null};
  history.replaceState(null, "", "?t=" + tk);   /* o ícone salvo na tela do celular guarda o link pessoal */
  return carregarMinistro().then(() => { splash = false; render(); });
}
function escolherPessoa(p){
  if (p.precisa_codigo) { busca.sel = p; busca.erro = ""; render(); setTimeout(() => $("#login-cod")?.focus(), 50); return; }
  return sb.rpc("ministro_entrar", {p_id: p.id, p_final: ""}).then(({data}) => data ? logarMinistro(data) : toast("Não foi possível entrar."));
}
const datas = arr => (arr || []).map(d => String(d).slice(0, 10));
async function carregarMinistro(){
  if (!token) return;
  const {data, error} = await sb.rpc("ministro_dados", {p_token: token});
  if (error) {
    if (/inválido/i.test(error.message)) { token = null; LS.set("escala_token", null); LS.set("escala_nome", null); render(); }
    return;
  }
  state.pessoas = data.pessoas.map(p => ({...p, whats: p.whats || "", indisp: datas(p.indisp)}));
  state.eventos = data.eventos.map(e => ({...e, data: String(e.data).slice(0, 10),
    vagas: e.vagas.map(v => ({...v, recusaram: v.recusaram || []}))}));
  euId = data.eu;
  LS.set("escala_nome", pessoa(euId).nome);
  if (location.search.indexOf(token) < 0) history.replaceState(null, "", "?t=" + token);
  if (!$("#modal").classList.contains("on") && !modoLider()) render();
}
async function rpcAcao(acao, vagaId, extra = {}){
  const {error} = await sb.rpc("ministro_acao", {p_token: token, p_acao: acao, p_vaga: vagaId || null, p_extra: extra});
  if (error) { toast(error.message || "Não foi possível salvar. Tente de novo."); await carregarMinistro(); return false; }
  await carregarMinistro(); return true;
}
/* devolve true quando a ação foi tratada aqui (tela dos ministros) */
async function acaoMinistro(a, b, ev, v){
  switch (a) {
    case "entrar-splash": splash = false; if (token && !euId) await carregarMinistro(); render(); return true;
    case "escolher": { const p = (busca.res || []).find(x => x.id === b.dataset.p); if (p) escolherPessoa(p); return true; }
    case "voltar-busca": busca.sel = null; render(); return true;
    case "sair": token = null; euId = null; LS.set("escala_token", null); LS.set("escala_nome", null); busca = {q: "", res: null};
      history.replaceState(null, "", location.pathname); render(); return true;
    case "confirmar": if (await rpcAcao("confirmar", v.id)) toast("Presença confirmada. Obrigado! 🙌"); return true;
    case "recusar-ok": { const m = $("#motivo").value.trim(); if (!m) { $("#motivo").style.borderColor = "var(--r)"; toast("Escreva o motivo"); return true; }
      closeModal(); if (await rpcAcao("recusar_todos", v.id, {motivo: m})) toast("Aviso enviado ao líder"); return true; }
    case "pedir-troca": { const sel = document.querySelector('input[name="sub"]:checked'), m = $("#motivo").value.trim();
      if (!sel) { toast("Escolha quem vai te substituir"); return true; }
      const q = pessoa(sel.value), evId = ev.id, vId = v.id;
      closeModal();
      if (!(await rpcAcao("pedir_troca", vId, {para: sel.value, motivo: m}))) return true;
      const ev2 = evento(evId), v2 = ev2 && vaga(ev2, vId);
      modal(`<div class="enviado"><div class="ok-ico" aria-hidden="true">✓</div><h3>Pedido enviado para ${esc(primeiro(q.nome))}</h3>
        <p>Agora é aguardar ${esc(primeiro(q.nome))} aceitar no app. Chame no WhatsApp para combinar.</p>
        ${q.whats && ev2 && v2 ? `<a class="btn big wa" href="${waLink(q, msgPedido(ev2, v2, q))}" target="_blank" rel="noopener">Conversar com ${esc(primeiro(q.nome))} no WhatsApp</a>` : ""}
        <button class="btn ghost" data-act="close">Fechar</button></div>`);
      return true; }
    case "avisar-lider": { const m = $("#motivo")?.value.trim(); closeModal();
      if (await rpcAcao("avisar_lider", v.id, {motivo: m || ""})) toast("O líder foi avisado e a vaga ficou aberta"); return true; }
    case "cancelar-troca": if (await rpcAcao("cancelar_troca", v.id)) toast("Ok, você continua na escala"); return true;
    case "aceitar-troca": { const antes = primeiro(pessoa(v.pessoaId).nome);
      if (await rpcAcao("aceitar_troca", v.id)) toast(`Você cobriu ${antes}. Obrigado! 🙌`); return true; }
    case "negar-troca": if (await rpcAcao("negar_troca", v.id)) toast("Ok, avisamos que você não consegue"); return true;
    case "assumir": if (await rpcAcao("assumir", v.id)) toast("Vaga assumida. Obrigado! 🙌"); return true;
    case "rmindisp": if (await rpcAcao("indisp_rm", null, {data: b.dataset.d})) toast("Data removida"); return true;
    case "indisp-add": if (await rpcAcao("indisp_add", null, {data: b.dataset.d})) toast("Data marcada como indisponível"); return true;
  }
  return false;
}

/* ===================== LÍDER (login + sincronização com o banco) ===================== */
const pRow = p => ({id: p.id, nome: p.nome, whats: p.whats || "", funcoes: p.funcoes, indisp: p.indisp || [], obs: p.obs || null});
const eRow = e => ({id: e.id, nome: e.nome, data: e.data, hora: e.hora});
const vRow = (e, v) => ({id: v.id, evento_id: e.id, funcao: v.funcao, pessoa_id: v.pessoaId || null, status: v.status,
  motivo: v.motivo || "", troca: !!v.troca, pedido_para: v.pedidoPara || null, recusaram: v.recusaram || [],
  status_antes: v.statusAntes || null, grupo: v.grupo || null, substituiu: v.substituiu || null,
  respondido_em: v.respondidoEm ? new Date(v.respondidoEm).toISOString() : null});
function linhasBanco(){
  const slots = new Set([...Object.keys(state.equipes || {}), ...Object.keys(state.todasVozes || {})]);
  return {
    pessoas: state.pessoas.map(pRow),
    eventos: state.eventos.map(eRow),
    vagas: state.eventos.flatMap(e => e.vagas.map(v => vRow(e, v))),
    equipes: [...slots].map(k => ({slot: k, linhas: (state.equipes[k] || []).map(r => ({funcao: r.funcao, pid: r.pid || ""})), todas_vozes: !!(state.todasVozes || {})[k]}))
  };
}
const CHAVE = {pessoas: "id", eventos: "id", vagas: "id", equipes: "slot"};
let foto = null;   /* última versão salva no banco, para mandar só o que mudou */
function tirarFoto(){
  const l = linhasBanco(); foto = {};
  for (const t in l) foto[t] = new Map(l[t].map(r => [r[CHAVE[t]], JSON.stringify(r)]));
}
async function carregarTudo(){
  const [p, e, v, q] = await Promise.all([
    sb.from("pessoas").select("id,nome,whats,funcoes,indisp,obs,token").order("nome"),
    sb.from("eventos").select("*"),
    sb.from("vagas").select("*"),
    sb.from("equipes").select("*")]);
  const erro = p.error || e.error || v.error || q.error; if (erro) throw erro;
  const porEv = {};
  v.data.forEach(r => (porEv[r.evento_id] = porEv[r.evento_id] || []).push({id: r.id, funcao: r.funcao, pessoaId: r.pessoa_id,
    status: r.status, motivo: r.motivo, troca: r.troca, pedidoPara: r.pedido_para, recusaram: r.recusaram || [],
    statusAntes: r.status_antes, grupo: r.grupo, substituiu: r.substituiu, respondidoEm: r.respondido_em}));
  state = {
    pessoas: p.data.map(r => ({...r, whats: r.whats || "", indisp: datas(r.indisp)})),
    eventos: e.data.map(r => ({id: r.id, nome: r.nome, data: String(r.data).slice(0, 10), hora: r.hora, vagas: porEv[r.id] || []})),
    equipes: Object.fromEntries(q.data.map(r => [r.slot, r.linhas || []])),
    todasVozes: Object.fromEntries(q.data.map(r => [r.slot, r.todas_vozes]))
  };
  tirarFoto(); carregado = true;
}
let salvando = false, deNovo = false;
async function sincronizar(){
  if (!foto) return;
  if (salvando) { deNovo = true; return; }
  salvando = true; setSync("saving");
  try {
    const l = linhasBanco(), mud = {}, del = {};
    let novaPessoa = false;
    for (const t in l) {
      const atuais = new Map(l[t].map(r => [r[CHAVE[t]], r]));
      mud[t] = l[t].filter(r => foto[t].get(r[CHAVE[t]]) !== JSON.stringify(r));
      del[t] = [...foto[t].keys()].filter(k => !atuais.has(k));
      if (t === "pessoas" && mud[t].some(r => !foto[t].has(r.id))) novaPessoa = true;
    }
    const up = async t => { if (mud[t].length) { const {error} = await sb.from(t).upsert(mud[t], {onConflict: CHAVE[t]}); if (error) throw error; } };
    const rm = async t => { if (del[t].length) { const {error} = await sb.from(t).delete().in(CHAVE[t], del[t]); if (error) throw error; } };
    await up("pessoas"); await up("eventos"); await up("equipes");
    await rm("vagas"); await up("vagas"); await rm("eventos"); await rm("equipes"); await rm("pessoas");
    tirarFoto(); setSync("ok");
    if (novaPessoa) { await carregarTudo(); render(); }   /* pega o link pessoal gerado pelo banco */
  } catch (err) {
    console.error(err); setSync("err"); toast("Não foi possível salvar. Recarregando…");
    try { await carregarTudo(); render(); } catch (e2) {}
  }
  salvando = false;
  if (deNovo) { deNovo = false; sincronizar(); }
}
async function atualizarLider(){
  if (salvando || deNovo || $("#modal").classList.contains("on")) return;
  const ativo = document.activeElement;
  if (ativo && /INPUT|TEXTAREA|SELECT/.test(ativo.tagName)) return;
  const antes = foto && JSON.stringify([...foto.vagas.values(), ...foto.pessoas.values(), ...foto.eventos.values()]);
  try { await carregarTudo(); } catch (e) { setSync("err"); return; }
  const depois = JSON.stringify([...foto.vagas.values(), ...foto.pessoas.values(), ...foto.eventos.values()]);
  setSync("ok"); if (antes !== depois) render();
}
setInterval(() => { if (!document.hidden && modoLider() && sessao && ehLider) atualizarLider(); }, 30000);
function setSync(kind){
  const el = $("#sync"); el.className = "sync" + (kind==="ok" ? " ok" : kind==="err" ? " err" : "");
  el.querySelector("span").textContent = kind==="ok" ? "Salvo" : kind==="err" ? "Erro ao salvar" : kind==="saving" ? "Salvando…" : "Conectando…";
}
async function iniciarLider(s){
  sessao = s; euId = null;
  if (!sessao) { ehLider = null; carregado = false; render(); return; }
  const {data} = await sb.from("lideres").select("email");
  ehLider = !!(data && data.length);
  render();
  if (ehLider && !carregado) { try { await carregarTudo(); setSync("ok"); } catch (e) { setSync("err"); toast("Não foi possível carregar a escala."); } render(); }
}
sb.auth.onAuthStateChange((evento, s) => {
  const mudou = (s && s.user && s.user.id) !== (sessao && sessao.user && sessao.user.id);
  sessao = s;
  if (!s) { ehLider = null; carregado = false; }
  /* não chamar o banco dentro deste aviso: o Supabase recomenda sair do callback antes */
  setTimeout(() => { if (!modoLider()) return; if (s && (mudou || !carregado)) { carregado = false; iniciarLider(s); } else render(); }, 0);
});
/* intro: replay automático a cada ~4 s enquanto a tela inicial estiver visível */
const INTRO_LOOP_MS = 4000;
function replayLogo(){
  document.querySelectorAll("#wordmark .lt").forEach(el => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; });
}
setInterval(() => { if (document.getElementById("wordmark") && !document.hidden) replayLogo(); }, INTRO_LOOP_MS);
function commit(msg){ render(); if (msg) toast(msg); sincronizar(); }

render();
sb.rpc("proximo_culto").then(({data}) => { if (data) { proxCulto = {...data, data: String(data.data).slice(0, 10)}; if (!modoLider() && splash) render(); } });
if (token) carregarMinistro();
</script>
